<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Weather Data Analyzer</title>
    <script>
      // Pick light/dark before the first paint (no flash): saved choice, else the system setting. Dark first.
      (function () {
        var saved = null;
        try { saved = localStorage.getItem("color-mode"); } catch (e) {}
        var dark = saved ? saved === "dark" : !window.matchMedia("(prefers-color-scheme: light)").matches;
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
