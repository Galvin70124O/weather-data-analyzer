# OPTIONAL local Postgres 16, as an alternative to the Neon dev/test branches.
#   docker compose up -d
# then use the docker-compose URLs at the bottom of .env.example.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: weather
      POSTGRES_PASSWORD: weather   # local development only
      POSTGRES_DB: weather
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weather -d weather"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
