name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest, alembic check)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: weather
          POSTGRES_PASSWORD: weather
          POSTGRES_DB: weather
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U weather"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Two databases: the tests wipe theirs and refuse to run on DATABASE_URL
      DATABASE_URL: postgresql://weather:weather@localhost:5432/weather
      TEST_DATABASE_URL: postgresql://weather:weather@localhost:5432/weather_test
      JWT_SECRET: ci-only-secret-that-is-long-enough-0123456789
      ENVIRONMENT: test
      OPENWEATHER_API_KEY: ""          # tests mock every outside API
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Create the test database
        run: psql postgresql://weather:weather@localhost:5432/weather -c "CREATE DATABASE weather_test"
      - name: Migrations apply and match the models
        run: |
          alembic upgrade head
          alembic check
      - run: pytest -q

  frontend:
    name: Frontend (Vitest, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
